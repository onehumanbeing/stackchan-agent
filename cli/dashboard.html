<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackChan Live</title>
<style>
  :root { --bg:#0b0b0b; --panel:#151515; --line:#262626; --fg:#f2f2f2; --muted:#8a8a8a; --ok:#5ad17a; --bad:#ff6b5b; --warn:#f2b84b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  .pill { font-size:12px; padding:2px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); border-color:#2f5d3b; } .pill.bad { color:var(--bad); border-color:#6b2f29; }
  main { display:grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap:16px; padding:16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding:16px; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0; }
  .panel h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; }
  .media { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 520px) { .media { grid-template-columns:1fr; } }
  .media img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#000; border-radius:10px; display:block; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:7px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; } th:first-child, td:first-child { text-align:left; }
  .bar { height:6px; background:#222; border-radius:3px; position:relative; min-width:90px; }
  .bar i { position:absolute; top:0; height:6px; width:3px; border-radius:2px; background:var(--fg); }
  .bar b { position:absolute; left:50%; top:-2px; width:1px; height:10px; background:#444; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-variant-numeric:tabular-nums; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .log { font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--muted); max-height:160px; overflow:auto; }
  .empty { color:var(--muted); padding:8px 0; }
  .hot { color:var(--warn); } .err { color:var(--bad); }
  .stack { display:grid; gap:16px; align-content:start; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:10px 0 4px; }
  .heard { font-size:16px; min-height:22px; }
  .heard .say { display:block; color:var(--muted); font-size:14px; margin-top:4px; }
  .think { font:13px/1.55 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; color:#b9b9b9; max-height:140px; overflow:auto; white-space:pre-wrap; }
  .steps { margin:0; padding-left:22px; font-size:14px; line-height:1.75; }
  .chip { display:inline-block; padding:0 8px; margin:1px 0; border:1px solid var(--line); border-radius:99px; color:var(--fg); font:13px/1.6 -apple-system, sans-serif; }
  .steps li.run { color:var(--warn); } .steps li.bad { color:var(--bad); } .steps .ms { color:var(--muted); }
  .pill.busy { color:var(--warn); border-color:#5d4a26; }
  .twin-panel { grid-column:1; }
  #twin { height:46vh; min-height:280px; border-radius:10px; overflow:hidden; background:#0e0e0e; }
  .stack { grid-row:1 / span 2; grid-column:2; }
  @media (max-width: 860px) { .stack, .twin-panel { grid-column:auto; grid-row:auto; } }
  #qr { position:fixed; right:16px; bottom:16px; display:none; align-items:center; gap:10px; padding:8px 12px 8px 8px;
        background:var(--panel); border:1px solid var(--line); border-radius:14px; z-index:5; }
  #qr .code { background:#fff; padding:6px; border-radius:8px; line-height:0; }
  #qr .code svg { width:150px; height:150px; }
  #qr .who { font-size:15px; } #qr .who span { display:block; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>StackChan</h1>
  <span id="link" class="pill">connecting…</span>
  <span id="cam" class="pill">camera –</span>
  <span id="face" class="pill">face –</span>
</header>
<main>
  <section class="panel">
    <h2><span>Camera</span><span>Face</span></h2>
    <div class="media">
      <img id="camimg" alt="camera">
      <img id="faceimg" alt="face">
    </div>
  </section>
  <section class="panel twin-panel">
    <h2><span>3D twin</span><span>drag to rotate · scroll to zoom</span></h2>
    <div id="twin"></div>
  </section>
  <div class="stack">
    <section class="panel">
      <h2><span>Servos</span><span id="t"></span></h2>
      <table>
        <thead><tr><th>ID</th><th>deg</th><th></th><th>load</th><th>V</th><th>°C</th></tr></thead>
        <tbody id="servos"><tr><td colspan="6" class="empty">no servo data yet</td></tr></tbody>
      </table>
    </section>
    <section class="panel">
      <h2><span>Robot</span></h2>
      <div class="kv" id="info"></div>
    </section>
    <section class="panel agent">
      <h2><span>Agent</span><span id="agstat" class="pill">off</span></h2>
      <div class="heard" id="heard"></div>
      <div class="label">Thinking</div>
      <div class="think" id="think"><span class="empty">–</span></div>
      <div class="label">Steps</div>
      <ol class="steps" id="steps"></ol>
    </section>
    <section class="panel">
      <h2><span>Faults</span></h2>
      <div class="log" id="faults"><div class="empty">none</div></div>
    </section>
  </div>
</main>
<div id="qr"><div class="code"></div><div class="who"></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
// Steps and the model's thinking are shown as icon + plain words, not JSON.
const FACE = {neutral:"🙂", happy:"😊", excited:"🤩", love:"😍", shy:"😳", wink:"😉", proud:"😌", smug:"😏", sad:"😢",
  cry:"😭", angry:"😠", doubt:"🤨", curious:"🧐", surprised:"😮", scared:"😱", dizzy:"😵‍💫", sleepy:"😪", sigh:"😮‍💨",
  bored:"😑", listening:"👂", thinking:"🤔", daydream:"💭", yawn:"🥱", doze:"😴"};
const GESTURE = {wave:"👋", nod:"🙆", shake:"🙅", dance:"💃"};
function describe(a) {
  const quick = a.ms ? ` <span class="ms">${a.ms} ms</span>` : "";
  if (a.say != null) return `${a.face ? FACE[a.face] || "🙂" : "💬"} “${esc(a.say)}”`;
  if (a.do === "face") return `${FACE[a.expression] || "🙂"} ${esc(a.expression)}${a.ms ? " (briefly)" : ""}`;
  if (a.do === "gesture") return `${GESTURE[a.name] || "🤖"} ${esc(a.name)}${a.times > 1 ? " ×" + a.times : ""}`;
  if (a.do === "head") {
    const y = +a.yaw || 0, p = +a.pitch || 0;
    const dir = [y && (y > 0 ? "left " : "right ") + Math.abs(y) + "°", p && (p > 0 ? "up " : "down ") + Math.abs(p) + "°"].filter(Boolean).join(", ");
    return `🤖 head ${dir || "straight ahead"}${quick}`;
  }
  if (a.do === "arm") return `💪 ${esc(a.side)} arm ${+a.deg ? "↑ " + a.deg + "°" : "down"}${quick}`;
  if (a.do === "wait") return `⏳ wait ${a.s ?? 1} s`;
  return esc(JSON.stringify(a));
}
function step(x) {
  const a = x.act || {}, cls = x.ms == null ? "run" : (x.ok ? "" : "bad");
  const mark = a.skipped ? `<span class="ms">skipped</span>` : x.ms == null ? "…" : (x.ok ? "✓" : "✗ " + esc(x.error || ""));
  return `<li class="${cls}">${describe(a)} ${mark}</li>`;
}
function prettyThinking(text) {     // step-like JSON in the thinking becomes the same icon + words
  return esc(text).replace(/\{[^{}\n]*\}|-?\s*&quot;do&quot;:[^\n]*/g, m => {
    const raw = m.replace(/&quot;/g, '"').replace(/&amp;/g, "&").replace(/^-?\s*/, "").replace(/\s*\(.*\)\s*$/, "");
    try { return `<span class="chip">${describe(JSON.parse(raw.startsWith("{") ? raw : "{" + raw + "}"))}</span>`; }
    catch { return m; }
  });
}
function renderAgent(g) {
  if (!g) return;
  $("agstat").textContent = g.status; $("agstat").className = "pill " + (g.status === "off" ? "" : g.status === "idle" ? "ok" : "busy");
  $("heard").innerHTML = g.heard ? `“${esc(g.heard)}”` + (g.say ? `<span class="say">${esc(g.say)}</span>` : "") : `<span class="empty">waiting for “Hey Grok”</span>`;
  const t = $("think"), stick = t.scrollTop + t.clientHeight >= t.scrollHeight - 4;
  t.innerHTML = g.thinking ? prettyThinking(g.thinking) : "–"; if (stick) t.scrollTop = t.scrollHeight;
  $("steps").innerHTML = (g.steps || []).map(step).join("");
}
function renderQr(url) {           // once: the link given with `dash --qr`
  if (!url || renderQr.done || !window.qrcode) return;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const box = $("qr"), m = url.match(/(?:x|twitter)\.com\/([^/?#]+)/);
  box.querySelector(".code").innerHTML = q.createSvgTag({cellSize: 4, margin: 0, scalable: true});
  box.querySelector(".who").innerHTML = m ? `<span>Follow on X</span>@${esc(m[1])}` : `<span>Scan</span>${esc(url.replace(/^https?:\/\//, ""))}`;
  box.style.display = "flex"; renderQr.done = true;
}
function render(s) {
  renderQr(s.qr);
  renderAgent(s.agent);
  if (window.twinUpdate) window.twinUpdate(s);
  $("link").textContent = s.connected ? "online" : ("offline" + (s.error ? " · " + s.error : ""));
  $("link").className = "pill " + (s.connected ? "ok" : "bad");
  $("cam").textContent = "camera " + (s.camera_fps ? s.camera_fps + " fps" : "–");
  const info = s.info || {}, w = info.wifi || {}, b = info.bus || {};
  $("face").textContent = "face " + (info.face || "–");
  const ids = Object.keys(s.servos || {}).sort((a, b) => a - b);
  $("servos").innerHTML = ids.length ? ids.map(id => {
    const v = s.servos[id], pct = Math.max(0, Math.min(100, 50 + v.deg / 3.6));
    return `<tr><td>${id}${v.moving ? " ·" : ""}</td><td>${v.deg.toFixed(1)}</td>
      <td><div class="bar"><b></b><i style="left:calc(${pct}% - 1px)"></i></div></td>
      <td>${(v.load / 10).toFixed(1)}%</td><td>${v.volt.toFixed(1)}</td>
      <td class="${v.temp >= 60 ? "hot" : ""}">${v.temp}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="empty">${b.ok === false ? "servo bus not found" : "no servo data yet"}</td></tr>`;
  $("t").textContent = s.t ? (s.t / 1000).toFixed(1) + " s" : "";
  const rows = [["firmware", info.fw], ["wifi", w.connected ? `${w.ssid} · ${w.ip} · ${w.rssi} dBm` : "offline"],
    ["bus", b.ok ? `Grove ${b.port} · ${b.baud} baud · ${b.errors} errors` : "not found"],
    ["uptime", info.uptime_s != null ? info.uptime_s + " s" : ""], ["link", s.via || ""]];
  $("info").innerHTML = rows.map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join("");
  const f = s.faults || [];
  $("faults").innerHTML = f.length ? f.slice().reverse().map(x => `<div class="${x.fault === "back" ? "" : "err"}">${x.at} · servo ${x.id} · ${esc(x.fault)}</div>`).join("") : `<div class="empty">none</div>`;
}
const es = new EventSource("/events");
es.onmessage = e => render(JSON.parse(e.data));
es.onerror = () => { $("link").textContent = "dashboard offline"; $("link").className = "pill bad"; };
// Camera and face: fetch the newest frame, show it once it has loaded, repeat.  A failed fetch keeps the last
// good frame (no broken image) and retries, so the page recovers by itself when the dashboard restarts.
function poll(id, url, every) {
  const i = new Image();
  i.onload = () => { $(id).src = i.src; setTimeout(() => poll(id, url, every), every); };
  i.onerror = () => setTimeout(() => poll(id, url, every), 1000);
  i.src = url + "?" + Date.now();
}
poll("camimg", "/camera.jpg", 120);
poll("faceimg", "/face.jpg", 500);
</script>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="/twin/scene.js"></script>
</body>
</html>
